<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TASL Marble Run - Live</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body data-role="live">

<header class="topbar">
  <div class="brand">
    <span class="dot" id="link-dot"></span>
    <h1 id="run-name">Marble Run</h1>
  </div>

  <div class="clock">
    <span class="clock-label">ELAPSED</span>
    <span class="clock-value" id="elapsed">00:00.0</span>
  </div>

  <div class="controls">
    <button id="btn-start" class="btn btn-go">START RUN</button>
    <button id="btn-stop"  class="btn">STOP</button>
    <button id="btn-reset" class="btn btn-quiet">RESET</button>

    <!-- There is deliberately no troubleshooting affordance here any more.
         Participants stand in front of this screen, and a station misbehaving
         is the operator's problem, not theirs. Diagnostics moved to /admin. -->
  </div>
</header>

<div>
  <section class="progress-strip">
    <div class="chain" id="chain"></div>
  </section>

  <main class="layout">
    <section class="cards" id="cards"></section>

    <aside class="logpane">
      <h2>EVENT LOG</h2>
      <div class="log" id="log"></div>
    </aside>
  </main>
</div>

<script src="/static/app.js"></script>
</body>
</html>
