<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TASL Marble Run - Live</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="dot" id="link-dot"></span>
    <h1 id="run-name">Marble Run</h1>
  </div>

  <div class="clock">
    <span class="clock-label">ELAPSED</span>
    <span class="clock-value" id="elapsed">00:00.0</span>
  </div>

  <div class="controls">
    <button id="btn-start" class="btn btn-go">START RUN</button>
    <button id="btn-stop"  class="btn">STOP</button>
    <button id="btn-reset" class="btn btn-quiet">RESET</button>

    <!-- Deliberately understated. The audience is watching this screen, so a
         problem shows as one small dot, not a scoreboard of failures. -->
    <button id="btn-diag" class="icon-btn" title="Troubleshooting" aria-label="Troubleshooting">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94
                 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
      </svg>
      <span class="alert-dot" id="diag-dot" hidden></span>
    </button>
  </div>
</header>

<div id="view-live">
  <section class="progress-strip">
    <div class="chain" id="chain"></div>
  </section>

  <main class="layout">
    <section class="cards" id="cards"></section>

    <aside class="logpane">
      <h2>EVENT LOG</h2>
      <div class="log" id="log"></div>
    </aside>
  </main>
</div>

<div id="view-diag" hidden>
  <div class="diag-bar">
    <h2>TROUBLESHOOTING</h2>
    <div class="diag-summary" id="diag-summary"></div>
    <button id="btn-diag-clear" class="btn btn-quiet">CLEAR COUNTERS</button>
    <button id="btn-diag-close" class="btn">CLOSE</button>
  </div>
  <div class="diag-list" id="diag-list"></div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
