<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1120" height="760" fill="#ffffff"/>

  <style>
    .t   { font-size: 13px; fill: #10171a; }
    .tb  { font-size: 13px; fill: #10171a; font-weight: 600; }
    .ts  { font-size: 11px; fill: #5b6a70; }
    .tv  { font-size: 12px; fill: #b5602c; font-weight: 600; }
    .ttl { font-size: 17px; fill: #10171a; font-weight: 600; }
    .w   { stroke: #10171a; stroke-width: 1.6; fill: none; }
    .wr  { stroke: #c0342b; stroke-width: 2.2; fill: none; }
    .wg  { stroke: #3d4b50; stroke-width: 2.2; fill: none; }
    .bx  { fill: #f1f5f4; stroke: #45545a; stroke-width: 1.4; }
    .bxa { fill: #fbf0d5; stroke: #9a6b00; stroke-width: 1.4; }
    .cmp { fill: #ffffff; stroke: #10171a; stroke-width: 1.4; }
  </style>

  <text class="ttl" x="30" y="34">TASL sensor node — as built</text>
  <text class="ts"  x="30" y="52">ESP32 DevKit V1 (30-pin) · one measurement station · two IR break-beams</text>

  <!-- ================= POWER CHAIN ================= -->
  <rect class="bx"  x="30"  y="78" width="112" height="46" rx="4"/>
  <text class="tb"  x="86"  y="99"  text-anchor="middle">1S LiPo</text>
  <text class="ts"  x="86"  y="115" text-anchor="middle">3.7 V 1000 mAh</text>

  <rect class="bx"  x="182" y="78" width="128" height="46" rx="4"/>
  <text class="tb"  x="246" y="99"  text-anchor="middle">TP4056</text>
  <text class="ts"  x="246" y="115" text-anchor="middle">+ protection</text>

  <rect class="bx"  x="350" y="78" width="96"  height="46" rx="4"/>
  <text class="tb"  x="398" y="99"  text-anchor="middle">SPST</text>
  <text class="ts"  x="398" y="115" text-anchor="middle">switch</text>

  <rect class="bxa" x="486" y="78" width="120" height="46" rx="4"/>
  <text class="tb"  x="546" y="99"  text-anchor="middle">MT3608</text>
  <text class="ts"  x="546" y="115" text-anchor="middle">set to 5.0 V</text>

  <rect class="bx"  x="646" y="78" width="132" height="46" rx="4"/>
  <text class="tb"  x="712" y="99"  text-anchor="middle">AMS1117-3.3</text>
  <text class="ts"  x="712" y="115" text-anchor="middle">5 V → 3.3 V</text>

  <line class="wr" x1="142" y1="101" x2="180" y2="101"/>
  <line class="wr" x1="310" y1="101" x2="348" y2="101"/>
  <line class="wr" x1="446" y1="101" x2="484" y2="101"/>
  <line class="wr" x1="606" y1="101" x2="644" y2="101"/>

  <text class="ts" x="161" y="94" text-anchor="middle">B+</text>
  <text class="ts" x="329" y="94" text-anchor="middle">OUT+</text>
  <text class="ts" x="465" y="94" text-anchor="middle">IN+</text>
  <text class="ts" x="625" y="94" text-anchor="middle">5 V</text>

  <!-- bulk cap between AMS out and rail -->
  <line class="wr" x1="778" y1="101" x2="900" y2="101"/>
  <line class="wr" x1="900" y1="101" x2="900" y2="150"/>
  <line class="w"  x1="880" y1="128" x2="920" y2="128"/>
  <line class="w"  x1="884" y1="135" x2="916" y2="135"/>
  <text class="tv" x="930" y="126">1000 µF 16 V</text>
  <text class="ts" x="930" y="141">stripe to GND · polarised</text>
  <line class="wg" x1="900" y1="135" x2="900" y2="690"/>

  <!-- ================= 3V3 RAIL ================= -->
  <line class="wr" x1="60" y1="180" x2="1060" y2="180"/>
  <text class="tv" x="60" y="172">+3V3 rail</text>
  <line class="wr" x1="900" y1="180" x2="900" y2="180"/>
  <line class="wr" x1="778" y1="101" x2="778" y2="101"/>
  <line class="wr" x1="900" y1="101" x2="900" y2="180"/>

  <!-- ================= GND RAIL ================= -->
  <line class="wg" x1="60" y1="690" x2="1060" y2="690"/>
  <text class="ts" x="60" y="708">GND — one common ground for everything</text>

  <!-- ================= BEAM A ================= -->
  <text class="tb" x="80" y="216">Beam A  → D19</text>
  <text class="ts" x="80" y="232">Beam B is identical → D18</text>

  <!-- emitter branch -->
  <line class="w" x1="110" y1="180" x2="110" y2="262"/>
  <rect class="cmp" x="94" y="262" width="32" height="42" rx="2"/>
  <text class="tv" x="136" y="280">220 Ω</text>
  <text class="ts" x="136" y="295">emitter limit</text>
  <line class="w" x1="110" y1="304" x2="110" y2="352"/>

  <polygon class="cmp" points="94,352 126,352 110,382"/>
  <line class="w" x1="94" y1="382" x2="126" y2="382"/>
  <line class="w" x1="130" y1="352" x2="142" y2="342"/>
  <line class="w" x1="136" y1="360" x2="148" y2="350"/>
  <text class="tv" x="60" y="412">IR LED 940 nm</text>
  <text class="ts" x="60" y="428">long leg = anode</text>
  <line class="w" x1="110" y1="382" x2="110" y2="690"/>

  <!-- beam gap -->
  <line stroke="#b5602c" stroke-width="1.4" stroke-dasharray="6 5" x1="128" y1="367" x2="272" y2="367"/>
  <text class="tv" x="200" y="359" text-anchor="middle">40 mm across pipe</text>

  <!-- phototransistor branch -->
  <line class="w" x1="290" y1="180" x2="290" y2="340"/>
  <rect class="cmp" x="274" y="340" width="32" height="54" rx="2"/>
  <text class="ts" x="316" y="352">collector</text>
  <text class="tv" x="316" y="368">photo-</text>
  <text class="tv" x="316" y="382">transistor</text>
  <text class="ts" x="316" y="398">emitter</text>
  <line class="w" x1="290" y1="394" x2="290" y2="470"/>

  <!-- signal tap to ESP32 -->
  <circle cx="290" cy="470" r="4" fill="#10171a"/>
  <line class="w" x1="290" y1="470" x2="430" y2="470"/>
  <text class="tv" x="360" y="462" text-anchor="middle">signal</text>

  <!-- pulldown -->
  <line class="w" x1="290" y1="470" x2="290" y2="522"/>
  <rect class="cmp" x="274" y="522" width="32" height="42" rx="2"/>
  <text class="tv" x="316" y="540">100 kΩ</text>
  <text class="ts" x="316" y="555">pull-down</text>
  <line class="w" x1="290" y1="564" x2="290" y2="690"/>

  <text class="ts" x="80" y="600">clear → HIGH</text>
  <text class="ts" x="80" y="617">ball blocks → LOW</text>
  <text class="ts" x="80" y="634">a pass is a falling edge</text>

  <!-- ================= ESP32 ================= -->
  <rect class="bx" x="430" y="252" width="220" height="330" rx="6"/>
  <text class="tb" x="540" y="278" text-anchor="middle">ESP32 DevKit V1</text>
  <text class="ts" x="540" y="294" text-anchor="middle">30-pin DOIT</text>

  <line class="wr" x1="410" y1="180" x2="410" y2="324"/>
  <line class="wr" x1="410" y1="324" x2="430" y2="324"/>
  <text class="tb" x="440" y="329">3V3</text>

  <line class="wg" x1="390" y1="690" x2="390" y2="358"/>
  <line class="wg" x1="390" y1="358" x2="430" y2="358"/>
  <text class="tb" x="440" y="363">GND</text>

  <text class="tb" x="440" y="475">D19</text>
  <text class="ts" x="474" y="475">beam A</text>

  <line class="w" x1="330" y1="510" x2="430" y2="510"/>
  <text class="tb" x="440" y="515">D18</text>
  <text class="ts" x="474" y="515">beam B</text>
  <text class="ts" x="336" y="503">from beam B block</text>

  <line class="w" x1="650" y1="404" x2="700" y2="404"/>
  <text class="tb" x="600" y="409" text-anchor="end">D34</text>
  <text class="ts" x="612" y="409">batt</text>

  <text class="tb" x="440" y="556">VIN</text>
  <text class="ts" x="474" y="556">leave disconnected</text>
  <line stroke="#c0342b" stroke-width="1.6" x1="470" y1="562" x2="484" y2="548"/>
  <line stroke="#c0342b" stroke-width="1.6" x1="470" y1="548" x2="484" y2="562"/>

  <!-- ================= BATTERY DIVIDER ================= -->
  <text class="tb" x="700" y="216">Battery sense → D34</text>
  <text class="ts" x="700" y="232">tapped after the switch, so it draws nothing when off</text>

  <line class="w" x1="760" y1="252" x2="760" y2="300"/>
  <text class="ts" x="700" y="252">from switch (VBAT_SW)</text>
  <rect class="cmp" x="744" y="300" width="32" height="42" rx="2"/>
  <text class="tv" x="786" y="318">100 kΩ 1%</text>
  <line class="w" x1="760" y1="342" x2="760" y2="404"/>

  <circle cx="760" cy="404" r="4" fill="#10171a"/>
  <line class="w" x1="700" y1="404" x2="760" y2="404"/>

  <line class="w" x1="760" y1="404" x2="760" y2="446"/>
  <rect class="cmp" x="744" y="446" width="32" height="42" rx="2"/>
  <text class="tv" x="786" y="464">100 kΩ 1%</text>
  <line class="w" x1="760" y1="488" x2="760" y2="690"/>

  <line class="w" x1="820" y1="404" x2="820" y2="446"/>
  <line class="w" x1="760" y1="404" x2="820" y2="404"/>
  <line class="w" x1="806" y1="446" x2="834" y2="446"/>
  <line class="w" x1="806" y1="453" x2="834" y2="453"/>
  <line class="w" x1="820" y1="453" x2="820" y2="690"/>
  <text class="tv" x="842" y="450">100 nF</text>
  <text class="ts" x="842" y="465">not optional</text>

  <text class="ts" x="700" y="520">4.2 V → 2.10 V at the ADC</text>
  <text class="ts" x="700" y="537">D34 is ADC1 — ADC2 dies when Wi-Fi starts</text>

  <!-- ================= RGB LED ================= -->
  <text class="tb" x="950" y="216">RGB status LED</text>
  <text class="ts" x="950" y="232">common cathode</text>

  <text class="tb" x="950" y="272">D25</text><text class="tv" x="1000" y="272">330 Ω → red</text>
  <text class="tb" x="950" y="298">D26</text><text class="tv" x="1000" y="298">150 Ω → green</text>
  <text class="tb" x="950" y="324">D27</text><text class="tv" x="1000" y="324">150 Ω → blue</text>
  <text class="ts" x="950" y="350">common → GND</text>
  <text class="ts" x="950" y="367">yellow = red + green</text>
  <text class="ts" x="950" y="392">common anode instead?</text>
  <text class="ts" x="950" y="409">tie common to 3V3,</text>
  <text class="ts" x="950" y="426">LOW turns a colour on</text>

  <!-- ================= NOTES ================= -->
  <text class="ts" x="30" y="736">VIN unconnected — the 3V3 pin is fed externally, so switch OFF before plugging in USB, every time.  ·  MT3608 must read 5.0 V on no load before it touches the board.  ·  1000 µF is polarised.</text>
</svg>
